name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python GObject bindings
        run: sudo apt-get update && sudo apt-get install -y python3-gi
      - name: Validate Python and installer
        run: |
          /usr/bin/python3 -m py_compile gpu_selector.py
          bash -n install.sh
      - name: Test launch environments and preference restoration
        run: /usr/bin/python3 -m unittest discover -s tests -v
